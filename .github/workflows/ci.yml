name: A.T.H.E.N.A. CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Secret Leak & Sanitization Check
      run: |
        ! find . -name "*.db" -o -name ".athena_*" | grep -q . || (echo "FAILED: Secret or DB file detected!" && exit 1)

    - name: Seed Synthetic Cohort Database
      run: |
        python seed_demo_data.py

    - name: Run Automated Test Suite
      run: |
        python -m unittest discover -s tests -v

  test-r-plumber:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.4'

    - name: Install R packages
      run: |
        install.packages(c("plumber", "jsonlite"), repos = "https://cloud.r-project.org")
      shell: Rscript {0}

    - name: Validate R Plumber Syntax
      run: |
        Rscript -e "parse('plumber.R')"
